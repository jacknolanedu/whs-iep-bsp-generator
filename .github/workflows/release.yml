name: Release

# Builds installers and publishes them as a GitHub release.
# Trigger: push a tag like v1.2.0 (must match package.json's version — the
# guard step below enforces it). The release goes live as soon as the first
# job finishes, so only tag a commit that is ready for teachers.
# Full walkthrough: RELEASING.md.
#
# Tag pushes ONLY — deliberately no workflow_dispatch. A manual run would build
# from main at whatever version package.json currently holds, find the existing
# release with that tag, and silently skip every same-named asset (the publisher
# does not overwrite). To retry a failed build, re-run the tag's workflow run.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-upload:
    strategy:
      # Serialise the two builds so both append their files to ONE draft
      # release instead of racing to create two.
      # Also relies on fail-fast (GitHub's default): if the first job fails the
      # second never starts, so a failure cannot leave a second stray draft.
      max-parallel: 1
      matrix:
        include:
          - os: macos-latest
            arch: universal   # one DMG that runs on Intel and Apple-Silicon Macs
          - os: windows-latest
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Stop if the tag does not match package.json's version
        shell: bash
        run: |
          PKG="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG. Bump package.json first (see RELEASING.md)."
            exit 1
          fi

      - run: npm ci

      - name: Build installers and upload to the release
        run: npm run publish -- --arch=${{ matrix.arch }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Teachers reach a release page straight from the README's download buttons and
  # from the app's own update prompt — most will never read the README. Without
  # this, they meet Gatekeeper or SmartScreen with no explanation and get stuck.
  # So every release carries the install guidance, automatically, forever.
  install-guidance:
    needs: build-and-upload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add the install guidance to the release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          BODY="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"

          # Idempotent: the marker means the guidance is already there, so a
          # re-run never duplicates it. Any release notes a human wrote are kept
          # and the guidance is appended below them.
          if printf '%s' "$BODY" | grep -q '<!-- install-guidance -->'; then
            echo "Guidance already present on $TAG — nothing to do."
            exit 0
          fi

          {
            if [ -n "$BODY" ]; then
              printf '%s\n\n---\n\n' "$BODY"
            fi
            cat .github/release-install-guidance.md
          } > /tmp/notes.md

          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file /tmp/notes.md
          echo "Install guidance added to $TAG."
